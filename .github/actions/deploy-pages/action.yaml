name: Deploy GitHub Pages
description: Deploy repository content to GitHub Pages
runs:
  using: composite
  steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Build github-pages artifact
      shell: bash
      run: |
        set -euo pipefail
        # Exclude repository internals from Pages artifact.
        tar --exclude=.git --exclude=.github -cf github-pages.tar .
        gzip -f github-pages.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: github-pages
        path: github-pages.tar.gz
        retention-days: 1

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
